name: LUKS End-to-End Test

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/e2e-luks.yml"
      - "profiles/**"
      - "scripts/**"
  workflow_dispatch:
    inputs:
      profile:
        description: "Profile JSON to build and test"
        required: true
        default: "profiles/dakota-dual.profile.json"
      skip_upload:
        description: "Build ISO but skip uploading (dry run)"
        required: false
        default: true
        type: boolean
  schedule:
    - cron: "0 5 * * 1"

concurrency:
  group: e2e-luks
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-iso:
    name: Build & Verify ISO
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Checkout superiso
        uses: actions/checkout@v4

      - name: Checkout tacklebox
        uses: actions/checkout@v4
        with:
          repository: tuna-os/tacklebox
          path: tacklebox-src

      - uses: actions/setup-go@v5
        with:
          go-version-file: tacklebox-src/go.mod

      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xorriso mtools squashfs-tools dosfstools \
            systemd-boot systemd-boot-efi podman rclone dracut-live cryptsetup

      - name: Build tacklebox
        run: |
          cd tacklebox-src
          go build -o /usr/local/bin/tacklebox ./cmd/tacklebox
          tacklebox --version || echo "tacklebox built successfully"

      - name: Prepare output directories
        run: |
          sudo install -d -o "$(id -u)" -g "$(id -g)" /var/tmp/tbx
          sudo install -d -o "$(id -u)" -g "$(id -g)" /mnt/iso-out

      - name: Restore build caches
        uses: actions/cache@v4
        with:
          path: |
            /var/tmp/tbx/initramfs-cache
            /var/tmp/tbx/squashfs-cache
          key: superiso-cache-${{ github.run_id }}
          restore-keys: |
            superiso-cache-

      - name: Select profile
        id: profile
        run: |
          PROFILE="${{ inputs.profile || 'profiles/dakota-dual.profile.json' }}"
          echo "path=$PROFILE" >> "$GITHUB_OUTPUT"
          echo "name=$(basename $PROFILE .profile.json)" >> "$GITHUB_OUTPUT"

      - name: Pre-pull container images
        run: |
          jq -r '(.live_environments[]?.base_image // empty), (.images[]?.ref // empty)' \
            "${{ steps.profile.outputs.path }}" | sort -u | \
            xargs -P4 -I{} sudo podman pull {}

      - name: Build ISO with tacklebox
        run: |
          sudo tacklebox build "${{ steps.profile.outputs.path }}" \
            --iso "/mnt/iso-out/${{ steps.profile.outputs.name }}.iso" \
            -b /var/tmp/tbx

      - name: Verify ISO
        run: |
          sudo tacklebox verify "/mnt/iso-out/${{ steps.profile.outputs.name }}.iso"

      - name: Checksums
        run: |
          cd /mnt/iso-out
          sha256sum *.iso > SHA256SUMS
          cat SHA256SUMS

      - name: Upload ISO artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "${{ steps.profile.outputs.name }}-iso"
          path: /mnt/iso-out/*.iso
          retention-days: 7
          if-no-files-found: ignore

      - name: Build summary
        if: always()
        run: |
          echo '## ISO Build Results' >> "$GITHUB_STEP_SUMMARY"
          echo "Profile: \`${{ steps.profile.outputs.path }}\`" >> "$GITHUB_STEP_SUMMARY"
          ls -lh /mnt/iso-out/*.iso 2>/dev/null | awk '{print "- `" $NF "` (" $5 ")"}' >> "$GITHUB_STEP_SUMMARY"
          if [ -f /mnt/iso-out/SHA256SUMS ]; then
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            cat /mnt/iso-out/SHA256SUMS >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
